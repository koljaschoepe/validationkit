name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same PR / branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  gates:
    name: typecheck + test + eval + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Lint step is deferred — Next 16 removed `next lint`; ESLint flat-config
      # setup is a follow-up sub-plan. See repo-health-and-workflow-overhaul §13.
      # - name: Lint
      #   run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Golden-set eval
        run: pnpm eval

      - name: Doc-consistency check (warning-only)
        run: pnpm doc:check

      - name: Build
        run: pnpm build

  conflict-eval:
    name: LLM-conflict-eval (optional)
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only runs on push to main, and silently no-ops if ANTHROPIC_API_KEY secret is unset.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Conflict-eval (no-op without ANTHROPIC_API_KEY)
        run: pnpm eval:conflicts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Upload conflict-eval results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: conflict-eval-results
          path: eval/conflicts/results/*.json
          if-no-files-found: ignore
