name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same PR / branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  gates:
    name: typecheck + test + eval + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm --filter @vk/web lint

      - name: Unit tests
        run: pnpm test

      - name: Golden-set eval
        run: pnpm eval

      - name: Doc-consistency check (warning-only)
        run: pnpm doc:check

      - name: Build
        run: pnpm build

  integration:
    name: Integration tests (Postgres-Service)
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Nova-3b Sub-A: integration-Pool läuft nur auf main-Push (Tier-Split, Master Q4).
    # PR-Path bleibt schnell (typecheck + lint + unit-tests + eval + build).
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vk
          POSTGRES_PASSWORD: vk_local
          POSTGRES_DB: validationkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run migrations against test DB
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://vk:vk_local@127.0.0.1:5432/validationkit_test
      - name: Run unit + integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgres://vk:vk_local@127.0.0.1:5432/validationkit_test

  lighthouse:
    name: Lighthouse-CI (Perf 85 / A11y 95 / BP 95)
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @vk/web build
      - name: Run Lighthouse-CI
        run: pnpm exec lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  conflict-eval:
    name: LLM-conflict-eval (optional)
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Now runs on both push to main AND pull_request. No-ops if ANTHROPIC_API_KEY secret is unset.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Conflict-eval (no-op without ANTHROPIC_API_KEY)
        run: pnpm eval:conflicts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Upload conflict-eval results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: conflict-eval-results
          path: eval/conflicts/results/*.json
          if-no-files-found: ignore
